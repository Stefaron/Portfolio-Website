name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type and content check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Smoke test
        run: |
          npm run preview -- --port 4322 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4322/ > /dev/null && break
            sleep 1
          done
          npm run smoke -- http://localhost:4322
